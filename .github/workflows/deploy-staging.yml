name: Build and deploy staging

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-stage]

concurrency:
  group: staging-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      # Frontend code lives in its own (private) repository; this repo only
      # orchestrates. The fine-grained PAT has Contents:read on that repo only.
      - name: Checkout frontend source
        uses: actions/checkout@v7
        with:
          repository: DailyCreativeRD/ssg-nextjs-page
          ref: main
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check
        run: pnpm typecheck

      # ONE build, root path: Cloudflare Pages serves both environments at /,
      # so this output is simultaneously the staging deploy and the production
      # candidate. Image URLs are rewritten to IMAGES_BASE_URL during the build.
      - name: Build static site
        env:
          STRAPI_API_URL: ${{ secrets.STRAPI_API_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          IMAGES_BASE_URL: ${{ vars.IMAGES_BASE_URL }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
          DEPLOYMENT_LABEL: published
        run: pnpm build

      # Identity record that travels inside the candidate ZIP.
      - name: Write release manifest
        env:
          IMAGES_BASE_URL: ${{ vars.IMAGES_BASE_URL }}
        run: |
          printf '%s\n' \
            "source_sha=${{ github.sha }}" \
            "frontend_sha=$(git rev-parse HEAD)" \
            "run_id=${{ github.run_id }}" \
            "content_sha256=$(cat content-hash.txt)" \
            "images_base=${IMAGES_BASE_URL}" \
            > out/release-manifest.txt

      - name: Preserve production-ready artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-site-${{ github.run_id }}
          path: out
          retention-days: 30
          if-no-files-found: error

  deploy-staging:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: production-site-${{ github.run_id }}
          path: out

      - name: Deploy to Cloudflare Pages (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create phihong-stage --production-branch=main \
            || echo "project already exists"
          npx wrangler@4 pages deploy out --project-name=phihong-stage --branch=main --commit-dirty=true

      # Dormant until a CLOUDFLARE_ZONE_ID secret exists (i.e. a custom domain).
      # Pages self-invalidates and image URLs are immutable, so nothing needs
      # purging before then.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::notice::No CLOUDFLARE_ZONE_ID configured yet - skipping cache purge."
          else
            curl --fail -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          fi

  publish-production-candidate:
    needs: [verify-and-build, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Releases count as repository contents

    steps:
      - name: Download production-ready artifact
        uses: actions/download-artifact@v8
        with:
          name: production-site-${{ github.run_id }}
          path: out-production

      - name: Package production candidate with checksum
        shell: bash
        run: |
          archive="production-site-${{ github.run_id }}.zip"
          (cd out-production && zip -r "../$archive" .)
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish production candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "staging-${{ github.run_id }}" \
            "production-site-${{ github.run_id }}.zip" \
            "production-site-${{ github.run_id }}.zip.sha256" \
            --title "Staging candidate ${{ github.run_id }}" \
            --notes "Production-ready counterpart of successful staging workflow run ${{ github.run_id }}."
